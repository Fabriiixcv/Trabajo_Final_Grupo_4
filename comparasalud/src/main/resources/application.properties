spring.application.name=comparasalud
server.port=8088
spring.datasource.url=jdbc:postgresql://localhost:5432/base_datos
spring.datasource.username=postgres
spring.datasource.password=postgre
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Configuracion de Logs en consola y archivo
logging.level.root=INFO
logging.level.com.upc.comparasalud=info
logging.file.name=logs/api.log
#Evitando enviar el trace al cliente
spring.web.error.include-stacktrace=never

# Seguridad (JWT)
# Origenes permitidos del frontend, separados por coma (Live Server usa 5500; Angular usa 4200)
ip.frontend=http://localhost:5500,http://127.0.0.1:5500,http://localhost:4200
# Clave en Base64 de al menos 64 bytes (HS512). En produccion defínela con la variable de entorno JWT_SECRET.
jwt.secret=${JWT_SECRET:RBI/lQPntuLWK58W44iZ64y1xDym9M7l+MnGnfqhUARUaaN+sFkBbJhdROVeu699Fdm5ShKcfJcyI/F3X6y3rA==}
jwt.expiracion-minutos=60
